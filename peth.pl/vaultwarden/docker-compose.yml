x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: ${SERVICE_NAME}
    restart: ${RESTART_POLICY}
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    networks:
      - traefik
    volumes:
      - ${CONTAINER_DIR}:/data
    environment:
      TZ: ${TZ}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.bitwarden-ui.rule=Host(`${VIRTUAL_HOST}`)"
      - "traefik.http.routers.bitwarden-ui.entrypoints=websecure"
      - "traefik.http.routers.bitwarden-ui.service=bitwarden-ui-service"
      - "traefik.http.services.bitwarden-ui-service.loadbalancer.server.port=80"
      - "traefik.http.routers.bitwarden-websocket.rule=Host(`${VIRTUAL_HOST}`) && Path(`/notifications/hub`)"
      - "traefik.http.routers.bitwarden-websocket.entrypoints=websecure"
      - "traefik.http.routers.bitwarden-websocket.service=bitwarden-websocket-service"
      - "traefik.http.services.bitwarden-websocket-service.loadbalancer.server.port=3012"
    logging: *default-logging

networks:
  traefik:
    external: true