x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY:-unless-stopped}
  init: true
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  env_file:
    - .env

services:
  vaultwarden:
    <<: *common
    image: vaultwarden/server:latest
    container_name: ${SERVICE_NAME}-server
    networks:
      - traefik
    volumes:
      - ${CONTAINER_DIR}:/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.${SERVICE_NAME}-ui.rule=Host(`${VIRTUAL_HOST}`)"
      - "traefik.http.routers.${SERVICE_NAME}-ui.service=${SERVICE_NAME}-ui-service"
      - "traefik.http.services.${SERVICE_NAME}-ui-service.loadbalancer.server.port=80"
      - "traefik.http.routers.${SERVICE_NAME}-websocket.rule=Host(`${VIRTUAL_HOST}`) && Path(`/notifications/hub`)"
      - "traefik.http.routers.${SERVICE_NAME}-websocket.service=${SERVICE_NAME}-websocket-service"
      - "traefik.http.services.${SERVICE_NAME}-websocket-service.loadbalancer.server.port=3012"

networks:
  traefik:
    external: true
