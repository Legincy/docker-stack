x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY:-unless-stopped}
  init: true
  stop_grace_period: 30s
  env_file:
    - .env
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  gitea:
    <<: *common
    image: gitea/gitea:latest
    container_name: ${SERVICE_NAME}-server
    networks:
      - traefik
      - default
    volumes:
      - ${CONTAINER_DIR}/gitea:/data
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${VIRTUAL_HOST}`)"
      - "traefik.http.routers.${SERVICE_NAME}.service=${SERVICE_NAME}-srv"
      - "traefik.http.services.${SERVICE_NAME}-srv.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=true"

  db:
    <<: *common
    image: postgres:14
    container_name: ${SERVICE_NAME}-db
    networks:
      - default
    volumes:
      - ${CONTAINER_DIR}/postgres:/var/lib/postgresql/data

  db-backup:
    <<: *common
    image: nfrastack/db-backup:4.9.2
    container_name: ${SERVICE_NAME}-db-backup
    init: false
    networks:
      - default
    depends_on:
      - db
    volumes:
      - ${CONTAINER_DIR}/db-backup:/backup

  # runner:
  #   <<: *common
  #   image: gitea/act_runner:latest
  #   container_name: ${SERVICE_NAME}-runner
