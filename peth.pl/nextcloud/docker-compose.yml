x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY:-unless-stopped}
  init: true
  stop_grace_period: 30s
  env_file:
    - .env
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  mariadb:
    <<: *common
    image: mariadb:lts
    container_name: ${SERVICE_NAME}-mariadb
    command: --transaction-isolation=READ-COMMITTED
    volumes:
      - ${CONTAINER_DIR}/mariadb:/var/lib/mysql

  redis:
    <<: *common
    image: redis:alpine
    container_name: ${SERVICE_NAME}-redis

  nextcloud:
    <<: *common
    image: nextcloud:35
    container_name: ${SERVICE_NAME}-server
    networks:
      - traefik
      - default
    depends_on:
      - redis
      - mariadb
    volumes:
      - ${CONTAINER_DIR}/html:/var/www/html
      - ${CONTAINER_DIR}/php-custom.ini:/usr/local/etc/php/conf.d/zzz-custom.ini
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${VIRTUAL_HOST}`)"
      - "traefik.http.routers.${SERVICE_NAME}.middlewares=${SERVICE_NAME},${SERVICE_NAME}_redirect"
      - "traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=80"
      - "traefik.http.middlewares.${SERVICE_NAME}.headers.stsSeconds=155520011"
      - "traefik.http.middlewares.${SERVICE_NAME}.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.${SERVICE_NAME}.headers.stsPreload=true"
      - "traefik.http.middlewares.${SERVICE_NAME}_redirect.redirectregex.permanent=true"
      - "traefik.http.middlewares.${SERVICE_NAME}_redirect.redirectregex.regex=/.well-known/(card|cal)dav"
      - "traefik.http.middlewares.${SERVICE_NAME}_redirect.redirectregex.replacement=/remote.php/dav/"

  cron:
    <<: *common
    image: nextcloud
    container_name: ${SERVICE_NAME}-cron
    entrypoint: /cron.sh
    depends_on:
      - mariadb
    volumes:
      - ${CONTAINER_DIR}/html:/var/www/html

  db-backup:
    <<: *common
    image: nfrastack/db-backup:4.9.2
    container_name: ${SERVICE_NAME}-db-backup
    init: false
    depends_on:
      - mariadb
    volumes:
      - ${CONTAINER_DIR}/db-backup:/backup

networks:
  traefik:
    external: true
