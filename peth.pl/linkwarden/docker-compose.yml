x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY}
  env_file:
    - .env
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  linkwarden:
    <<: *common
    image: ghcr.io/linkwarden/linkwarden:latest
    container_name: ${SERVICE_NAME}-app
    networks:
      - traefik
      - internal
    volumes:
      - ${CONTAINER_DIR}/data:/data/data
    environment:
      TZ: ${TZ}
      DATABASE_URL: postgresql://linkwarden:${POSTGRES_PASSWORD}@postgres:5432/linkwarden
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.linkwarden.entrypoints=websecure"
      - "traefik.http.routers.linkwarden.rule=Host(`${VIRTUAL_HOST}`)"
      - "traefik.http.services.linkwarden.loadbalancer.server.port=3000"

  postgres:
    <<: *common
    image: postgres:16-alpine
    container_name: ${SERVICE_NAME}-db
    networks:
      - internal
    volumes:
      - ${CONTAINER_DIR}/pgdata:/var/lib/postgresql/data
    environment:
      TZ: ${TZ}
      POSTGRES_USER: linkwarden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: linkwarden
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkwarden"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  traefik:
    external: true
  internal: