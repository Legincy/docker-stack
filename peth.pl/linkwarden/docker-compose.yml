x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY:-unless-stopped}
  init: true
  stop_grace_period: 30s
  env_file:
    - .env
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  linkwarden:
    <<: *common
    image: ghcr.io/linkwarden/linkwarden:latest
    container_name: ${SERVICE_NAME}-server
    networks:
      - traefik
      - internal
    volumes:
      - ${CONTAINER_DIR}/data:/data/data
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.${SERVICE_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${VIRTUAL_HOST}`)"
      - "traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=3000"

  postgres:
    <<: *common
    image: postgres:16-alpine
    container_name: ${SERVICE_NAME}-db
    networks:
      - internal
    volumes:
      - ${CONTAINER_DIR}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkwarden"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-backup:
    <<: *common
    image: nfrastack/db-backup:4.9.2
    container_name: ${SERVICE_NAME}-db-backup
    init: false
    networks:
      - internal
    depends_on:
      - postgres
    volumes:
      - ${CONTAINER_DIR}/db-backup:/backup

networks:
  traefik:
    external: true
  internal:
