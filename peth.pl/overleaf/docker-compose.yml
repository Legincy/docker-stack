x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY:-unless-stopped}
  init: true
  stop_grace_period: 30s
  env_file:
    - .env
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  sharelatex:
    <<: *common
    image: tuetenk0pp/sharelatex-full
    container_name: ${SERVICE_NAME}-server
    networks:
      - traefik
      - default
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ${CONTAINER_DIR}/sharelatex:/var/lib/overleaf
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${VIRTUAL_HOST}`)"
      - "traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=80"
      
  mongo:
    <<: *common
    image: mongo:8.0
    container_name: ${SERVICE_NAME}-mongo
    command: "--replSet overleaf"
    networks:
      - default
    volumes:
      - ${CONTAINER_DIR}/mongo:/data/db
    extra_hosts:
      - mongo:127.0.0.1
    healthcheck:
      test: echo 'db.stats().ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  mongo-init:
    image: mongo:7.0
    container_name: ${SERVICE_NAME}-mongo-init
    restart: "no"
    networks:
      - default
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: [
      "mongosh", "--host", "${MONGO_SERVER}:27017", "--quiet", "--eval",
      "try { rs.status(); print('replica set already initialized'); } catch (e) { rs.initiate({ _id: 'overleaf', members: [ { _id: 0, host: '${MONGO_SERVER}:27017' } ] }); }"
    ]

  redis:
    <<: *common
    image: redis:6.2
    container_name: ${SERVICE_NAME}-redis
    networks:
      - default
    volumes:
      - ${CONTAINER_DIR}/redis:/data

  db-backup:
    <<: *common
    image: nfrastack/db-backup:4.9.2
    container_name: ${SERVICE_NAME}-db-backup
    init: false
    networks:
      - default
    depends_on:
      - mongo
    volumes:
      - ${CONTAINER_DIR}/db-backup:/backup

networks:
  traefik:
    external: true
