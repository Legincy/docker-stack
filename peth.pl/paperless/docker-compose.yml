x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY:-unless-stopped}
  init: true
  stop_grace_period: 30s
  env_file:
    - .env
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  redis:
    <<: *common
    image: redis:7
    container_name: ${SERVICE_NAME}-redis
    networks:
      - default
    volumes:
      - ${CONTAINER_DIR}/redis/data:/data

  mariadb:
    <<: *common
    image: mariadb:11
    container_name: ${SERVICE_NAME}-mariadb
    networks:
      - default
    volumes:
      - ${CONTAINER_DIR}/mariadb:/var/lib/mysql

  paperless:
    <<: *common
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: ${SERVICE_NAME}-server
    init: false
    networks:
      - traefik
      - default
    depends_on:
      - redis
      - mariadb
    volumes:
      - ${CONTAINER_DIR}/paperless/data:/usr/src/paperless/data
      - ${CONTAINER_DIR}/paperless/media:/usr/src/paperless/media
      - ${CONTAINER_DIR}/paperless/export:/usr/src/paperless/export
      - ${CONTAINER_DIR}/paperless/consume:/usr/src/paperless/consume
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${VIRTUAL_HOST}`)"
      - "traefik.http.routers.${SERVICE_NAME}.service=${SERVICE_NAME}-srv"
      - "traefik.http.services.${SERVICE_NAME}-srv.loadbalancer.server.port=8000"

  db-backup:
    <<: *common
    image: nfrastack/db-backup:4.9.2
    container_name: ${SERVICE_NAME}-db-backup
    init: false
    networks:
      - default
    depends_on:
      - mariadb
    volumes:
      - ${CONTAINER_DIR}/db-backup:/backup

networks:
  traefik:
    external: true
