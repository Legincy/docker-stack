x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY:-unless-stopped}
  init: true
  stop_grace_period: 30s
  env_file:
    - .env
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  nginx:
    <<: *common
    image: nginx:alpine
    container_name: ${SERVICE_NAME}-server
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ${CONTAINER_DIR}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CONTAINER_DIR}/data:/data:ro
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${VIRTUAL_HOST}`)
      - traefik.http.services.${SERVICE_NAME}-srv.loadbalancer.server.port=80

networks:
  traefik:
    external: true
