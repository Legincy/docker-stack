x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY:-unless-stopped}
  init: true
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  
x-authelia-env: &authelia-env
  X_AUTHELIA_CONFIG: /config/configuration.yml
  AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/JWT_SECRET
  AUTHELIA_SESSION_SECRET_FILE: /secrets/SESSION_SECRET
  AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/STORAGE_ENCRYPTION_KEY
  AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE: /secrets/LDAP_AUTHELIA_PASSWORD
  AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE: /secrets/SMTP_PASSWORD

x-lldap-env: &lldap-env
  UID: 1000
  GID: 1000
  LLDAP_LDAP_BASE_DN: dc=peth,dc=pl
  LLDAP_JWT_SECRET_FILE: /secrets/LLDAP_JWT_SECRET
  LLDAP_KEY_SEED_FILE: /secrets/LLDAP_KEY_SEED
  LLDAP_LDAP_USER_PASS_FILE: /secrets/LLDAP_ADMIN_PASSWORD

services:
  authelia:
    <<: *common
    image: authelia/authelia:4.39
    container_name: ${SERVICE_NAME}-server
    depends_on:
      - lldap
    environment:
      <<: *authelia-env
    volumes:
      - ${CONTAINER_DIR}/authelia/config:/config
      - ${CONTAINER_DIR}/authelia/secrets:/secrets:ro
    networks:
      - traefik
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${VIRTUAL_HOST}`)
      - traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=9091
      - traefik.http.middlewares.${SERVICE_NAME}.forwardAuth.address=http://authelia:9091/api/authz/forward-auth
      - traefik.http.middlewares.${SERVICE_NAME}.forwardAuth.trustForwardHeader=true
      - traefik.http.middlewares.${SERVICE_NAME}.forwardAuth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email

  lldap:
    <<: *common
    image: lldap/lldap:stable
    container_name: ${SERVICE_NAME}-lldap
    environment:
      <<: *lldap-env
    volumes:
      -  ${CONTAINER_DIR}/lldap/data:/data
      -  ${CONTAINER_DIR}/lldap/secrets:/secrets:ro
    networks:
      - traefik
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.lldap.rule=Host(`${VIRTUAL_HOST_LLDAP}`)
      - traefik.http.services.lldap.loadbalancer.server.port=17170

networks:
  traefik:
    external: true