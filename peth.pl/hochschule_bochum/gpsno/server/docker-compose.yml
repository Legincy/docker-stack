x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY:-unless-stopped}
  init: true
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  env_file:
    - .env

services:
  gpsno:
    <<: *common
    image: ghcr.io/legincy/gpsno-server:latest
    container_name: ${SERVICE_NAME}
    networks:
      - traefik
    volumes:
      - ${CONTAINER_DIR}/data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${VIRTUAL_HOST}`)"
      - "traefik.http.routers.${SERVICE_NAME}.service=gpsno-srv"
      - "traefik.http.services.${SERVICE_NAME}-srv.loadbalancer.server.port=5000"

networks:
  traefik:
    external: true
