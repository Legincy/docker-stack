x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY:-unless-stopped}
  init: true
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  env_file:
    - .env

services:
  stirling-pdf:
    <<: *common
    image: frooodle/s-pdf:latest
    container_name: ${SERVICE_NAME}-server
    networks:
      - traefik
    volumes:
      - ${CONTAINER_DIR}/trainingData:/usr/share/tessdata
      - ${CONTAINER_DIR}/configs:/configs
      - ${CONTAINER_DIR}/logs:/logs
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${VIRTUAL_HOST}`)"
      - "traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=8080"

networks:
  traefik:
    external: true
