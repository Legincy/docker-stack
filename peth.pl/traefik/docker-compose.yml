x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY:-unless-stopped}
  init: true
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  env_file:
    - .env

services:
  traefik:
    <<: *common
    image: library/traefik:latest
    container_name: ${SERVICE_NAME}-server
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443/tcp"
      - "0.0.0.0:443:443/udp"
      - "0.0.0.0:9999:9999"
      - "[::]:80:80"
      - "[::]:443:443/tcp"
      - "[::]:443:443/udp"
      - "[::]:9999:9999"
    networks:
      - traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CONTAINER_DIR}/traefik.yml:/traefik.yml:ro
      - ${CONTAINER_DIR}/config:/etc/traefik/config:ro
      - ${CONTAINER_DIR}/certificates:/var/certificates
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${VIRTUAL_HOST}`)"
      - "traefik.http.routers.${SERVICE_NAME}.service=api@internal"
      - "traefik.http.routers.${SERVICE_NAME}.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${DASHBOARD_USERNAME}:${DASHBOARD_PASSWORD}"

networks:
  traefik:
    external: true
