x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY:-unless-stopped}
  init: true
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  env_file:
    - .env

services:
  tvheadend:
    <<: *common
    image: lscr.io/linuxserver/tvheadend
    container_name: ${SERVICE_NAME}-server
    init: false
    network_mode: host
    volumes:
      - ${CONTAINER_DIR}/config:/config
      - ${CONTAINER_DIR}/recordings:/recordings
