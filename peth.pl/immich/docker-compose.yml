x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY:-unless-stopped}
  init: true
  stop_grace_period: 30s
  env_file:
    - .env
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  immich-server:
    <<: *common
    image: ghcr.io/immich-app/immich-server:v3.3.1
    container_name: ${SERVICE_NAME}-server
    extends:
      file: hwaccel.transcoding.yml
      service: ${HWACCEL}
    networks:
      - traefik
      - default
    volumes:
      - ${CONTAINER_DIR}/immich:/usr/src/app/upload
    depends_on:
      - redis
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${VIRTUAL_HOST}`)"
      - "traefik.http.routers.${SERVICE_NAME}.service=${SERVICE_NAME}-srv"
      - "traefik.http.services.${SERVICE_NAME}-srv.loadbalancer.server.port=2283"

  machine-learning:
    <<: *common
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: ${SERVICE_NAME}-machine-learning
    networks:
      - default
    volumes:
      - ${CONTAINER_DIR}/immich:/usr/src/app/upload
      - ${CONTAINER_DIR}/model-cache:/cache

  redis:
    <<: *common
    image: redis:6.2
    container_name: ${SERVICE_NAME}-redis
    networks:
      - default

  db:
    <<: *common
    image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0
    container_name: ${SERVICE_NAME}-db
    networks:
      - default
    volumes:
      - ${CONTAINER_DIR}/pgdata:/var/lib/postgresql/data

  db-backup:
    <<: *common
    image: nfrastack/db-backup:4.9.2
    container_name: ${SERVICE_NAME}-db-backup
    init: false
    networks:
      - default
    depends_on:
      - db
    volumes:
      - ${CONTAINER_DIR}/db-backup:/backup

networks:
  traefik:
    external: true
