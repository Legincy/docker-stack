x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY:-unless-stopped}
  init: true
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  env_file:
    - .env

services:
  adguardhome:
    <<: *common
    image: adguard/adguardhome
    container_name: ${SERVICE_NAME}-server
    networks:
      traefik:
      home:
        ipv4_address: ${ADGUARD_IP}
    volumes:
      - ${CONTAINER_DIR}/work:/opt/adguardhome/work
      - ${CONTAINER_DIR}/conf:/opt/adguardhome/conf
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${VIRTUAL_HOST}`)"
      - "traefik.http.routers.${SERVICE_NAME}.service=${SERVICE_NAME}-srv"
      - "traefik.http.services.${SERVICE_NAME}-srv.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
  home:
    external: true
