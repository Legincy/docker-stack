x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

services:
  adguardhome:
    image: adguard/adguardhome
    container_name: ${SERVICE_NAME}
    restart: ${RESTART_POLICY}
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    networks:
      traefik:
      home:
        ipv4_address: ${ADGUARD_IP}
    volumes:
      - ${CONTAINER_DIR}/work:/opt/adguardhome/work
      - ${CONTAINER_DIR}/conf:/opt/adguardhome/conf
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.adguard.entrypoints=websecure"
      - "traefik.http.routers.adguard.rule=Host(`${VIRTUAL_HOST}`)"
      - "traefik.http.routers.adguard.service=adguard-srv"
      - "traefik.http.services.adguard-srv.loadbalancer.server.port=80"
    logging: *default-logging

networks:
  traefik:
    external: true
  home:
    external: true