x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY:-unless-stopped}
  init: true
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  env_file:
    - .env

services:
  twitch-drops-miner:
    <<: *common
    image: dungfu/twitch-drops-miner:latest
    container_name: ${SERVICE_NAME}
    ports:
      - "${WEB_PORT:-5801}:5800"
    volumes:
      - ${CONTAINER_DIR}/config:/TwitchDropsMiner/config
      - ${CONTAINER_DIR}/cache:/TwitchDropsMiner/cache
