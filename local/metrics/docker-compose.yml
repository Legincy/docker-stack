x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY}
  env_file:
    - .env
  logging: *default-logging

services:
  tailscale:
    <<: *common
    image: jauderho/tailscale:latest
    container_name: ${SERVICE_NAME}-tailscale
    command: tailscaled
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.forwarding=1
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${CONTAINER_DIR}/tailscale:/var/lib/tailscale
    environment:
      TZ: ${TZ}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  node-exporter:
    <<: *common
    image: prom/node-exporter
    container_name: ${SERVICE_NAME}-node-exporter
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points=^(/rootfs|/host|)/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.filesystem.ignored-fs-types=^(sys|proc|auto|cgroup|devpts|ns|au|fuse\.lxc|mqueue)(fs|)$$'
    environment:
      TZ: ${TZ}

  cadvisor:
    <<: *common
    image: gcr.io/cadvisor/cadvisor
    container_name: ${SERVICE_NAME}-cadvisor
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    environment:
      TZ: ${TZ}