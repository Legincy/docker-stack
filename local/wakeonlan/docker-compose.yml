x-common: &common
  restart: ${RESTART_POLICY:-unless-stopped}
  init: true
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  env_file:
    - .env

services:
  wakeonlan:
    <<: *common
    image: alpine
    container_name: wakeonlan
    network_mode: host
    command: >
      sh -c "apk add --no-cache wakeonlan &&
             wakeonlan ${TARGET_MAC} &&
             sleep 5"
