x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-2m}"
    max-file: "${LOG_MAX_FILES:-3}"

services:
  mc:
    image: itzg/minecraft-server
    container_name: ${SERVICE_NAME}
    restart: ${RESTART_POLICY}
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-25565}:25565"
      - "${BEDROCK_PORT:-19132}:19132/udp"
    volumes:
      - ${CONTAINER_DIR}/data:/data
    environment:
      TZ: ${TZ}
    mem_limit: ${MEM_LIMIT:-6g}
    tty: true
    stdin_open: true
    logging: *default-logging