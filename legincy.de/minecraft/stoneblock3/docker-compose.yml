x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-1m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-common: &common
  restart: ${RESTART_POLICY:-unless-stopped}
  init: true
  stop_grace_period: 30s
  env_file:
    - .env
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  stoneblock3:
    <<: *common
    image: itzg/minecraft-server:java17-jdk
    container_name: ${SERVICE_NAME}-server
    ports:
      - "${SERVER_PORT:-25566}:25565"
    volumes:
      - ${CONTAINER_DIR}/data:/data
    mem_limit: ${MEM_LIMIT:-6g}
    tty: true
    stdin_open: true